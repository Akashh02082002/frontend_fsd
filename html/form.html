<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <table>
            <tr>
                <td><label>Full Name:</label></td>
                <td><input type="text" required placeholder="Full Name"></input></td>
                        
            </tr>
            <tr>
                <td><label>Password:</label></td>
                <td><input type="password" required placeholder="Password"></input></td>
            </tr>
            <tr>
                <td><label>Gender:</label></td>
                <td><input type="radio" value="Gender">Male</input>
                <input type="radio" value="Gender">Female</input></td>
            </tr>
            <tr>
                <td><label>Email:</label></td>
                <td><input type="email" placeholder="Email"></input></td>
            </tr>
            <tr>
                <td><label>Phone no</label></td>
                <td>
                    <select>
                        <option value="93">+93</option>
                        <option value="355">+355</option>
                        <option value="213">+213</option>
                        <option value="1684">+1684</option>
                        <option value="54">+54</option>
                        <option value="91">+91</option>
                    </select>
                    <input type="number" placeholder="98652******"></input>
                </td>
            </tr>
            <tr>
                <td><input type="submit"></td>
            </tr>
        </table>
    </form>
</body>
</html>
