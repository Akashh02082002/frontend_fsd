<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Grid</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 250px);
            gap: 10px;
        }

        .box {
            background-color: orange;
            border: 2px solid;
        }

        .box img {
            width: 100%;
            height: 100%;
            object-fit: fill;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box box-1">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600" alt="Mountains">
        </div>

        <div class="box box-2">
            <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=600" alt="Dog">
        </div>

        <div class="box box-3">
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600" alt="Cat">
        </div>

        <div class="box box-4">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600" alt="Beach">
        </div>

        <div class="box box-5">
            <img src="https://images.unsplash.com/photo-1497250681960-ef046c08a56e?w=600" alt="Plant">
        </div>

        <div class="box box-6">
            <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=600" alt="Car">
        </div>

        <div class="box box-7">
            <img src="https://images.unsplash.com/photo-1511739001486-6bfe10ce785f?w=600" alt="Eiffel Tower">
        </div>

        <div class="box box-8">
            <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=600" alt="Coffee">
        </div>

        <div class="box box-9">
            <img src="https://images.unsplash.com/photo-1564760055775-d63b17a55c44?w=600" alt="Elephant">
        </div>
    </div>
</body>
</html>
